<div class="login-organizador">
  <mat-card class="login-organizador__card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-organizador__form">
        <div *ngIf="errorGeneral" class="login-organizador__error-general" data-testid="error-general">
          {{ errorGeneral }}
        </div>

        <mat-form-field appearance="outline" class="login-organizador__campo">
          <mat-label>Mail</mat-label>
          <input matInput type="email" formControlName="mail" data-testid="input-mail" />
          <mat-error *ngIf="form.controls['mail'].hasError('required')">
            El mail es obligatorio.
          </mat-error>
          <mat-error *ngIf="form.controls['mail'].hasError('email')">
            El mail no tiene un formato válido.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="login-organizador__campo">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" data-testid="input-password" />
          <mat-error *ngIf="form.controls['password'].hasError('required')">
            La contraseña es obligatoria.
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="enviando"
          data-testid="boton-submit"
        >
          Iniciar sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
