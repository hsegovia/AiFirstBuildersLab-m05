# Sirve el build de producción de Angular y resuelve el fallback de rutas del Angular Router:
# sin `try_files ... /index.html`, refrescar la página en una ruta como /auth/registro devuelve
# 404 porque nginx busca un archivo físico que no existe.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
