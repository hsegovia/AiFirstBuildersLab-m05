services:
  # SQL Server 2022. Cifrado en tránsito hacia este servicio: Encrypt=True en la connection
  # string de la Api (appsettings.Development.json / ConnectionStrings__Default, Block 1).
  # Cifrado at-rest (TDE): se habilita automáticamente al arrancar el contenedor `api` —
  # AppDbContextTdeExtensions.EnsureTdeEnabledAsync corre en Program.cs después de aplicar las
  # migraciones (MigrateAsync) y deja la base `BingoCart` con ENCRYPTION ON, verificable con
  # `SELECT is_encrypted FROM sys.databases WHERE name = 'BingoCart'`. Ambos pasos son
  # idempotentes: un `docker-compose down -v && docker-compose up --build` desde un clone limpio
  # vuelve a crear el schema y a habilitar TDE sin intervención manual
  # (docs/daw/security/threat-FEAT-001a.md, F-TM-07 — corrective loop VERIFY→CODE).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bingocart-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Credencial de desarrollo local únicamente — nunca se usa fuera de este docker-compose.
      # Sobreescribible con la variable de entorno MSSQL_SA_PASSWORD del host si se necesita otra.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-BingoCart_Dev2026!}"
    ports:
      # Riesgo aceptado #2 (threat-FEAT-001a.md): puerto expuesto al host solo para desarrollo
      # local. No debe exponerse en ningún entorno compartido o productivo.
      - "14330:1433"
    volumes:
      - bingocart-db-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Redis (spec FEAT-008b, Block 1): primer uso del proyecto, único responsable del estado del
  # carrito de compras por sesión anónima. Sin volumen: el carrito es efímero por diseño (TTL de
  # minutos), perderlo en un restart del contenedor es aceptable — a diferencia de `db`, no hay
  # ninguna garantía de durabilidad que preservar (threat-FEAT-008b.md, riesgo R-05 aceptado).
  redis:
    image: redis:7-alpine
    container_name: bingocart-redis
    ports:
      # Mismo criterio de remapeo que `db`/14330: puerto expuesto al host solo para desarrollo
      # local, para no chocar con un Redis local del desarrollador. No debe exponerse en ningún
      # entorno compartido o productivo (riesgo aceptado R-05, threat-FEAT-008b.md).
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # smtp4dev (spec FEAT-009b, Block 3): servidor SMTP de prueba que retiene los mails en memoria
  # sin reenviarlos a ningún destinatario real — captura los envíos de MailKitEmailSender tanto en
  # desarrollo local como en los tests de integración (MailKitEmailSenderTests, sin mocks, mismo
  # criterio "SQL Server/Redis reales" ya usado por ComprasControllerTests). Puerto 25 (SMTP) mapeado
  # a 2525 del host (evita colisión con un MTA local); puerto 80 (UI web + API REST de mensajes) a
  # 5080. Dev/test-only — mitigación R-08 del threat model: este contenedor NUNCA debe ser el valor
  # de Smtp:Host de una configuración de Producción.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: bingocart-smtp4dev
    environment:
      # StartTls (no None): MailKitEmailSender exige SecureSocketOptions.StartTls (mitigación R-03,
      # TLS obligatorio) — sin esto, la conexión desde MailKitEmailSenderTests fallaría contra este
      # contenedor con "STARTTLS not supported", muy distinto del comportamiento contra un SMTP real.
      ServerOptions__TlsMode: "StartTls"
    ports:
      - "2525:25"
      - "5080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/messages"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: BingoCart.Api/Dockerfile
    container_name: bingocart-api
    ports:
      - "8080:8080"
    environment:
      # Development (no Production) a propósito: Program.cs solo registra Swagger/SwaggerUI
      # cuando IsDevelopment() es true, y el criterio de aceptación de este bloque exige que
      # /swagger/index.html responda 200 dentro del contenedor.
      ASPNETCORE_ENVIRONMENT: "Development"
      # Dentro de la red de docker-compose el host es el nombre del servicio (`db`), no
      # localhost, y el puerto interno de SQL Server es 1433 (14330 es solo el mapeo al host,
      # Block 1). Misma credencial ya aceptada para el servicio `db` — sin secretos nuevos.
      ConnectionStrings__Default: "Server=db,1433;Database=BingoCart;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BingoCart_Dev2026!};TrustServerCertificate=True;Encrypt=True;"
      # Password de la master key de TDE (corrective loop VERIFY→CODE de FEAT-001a) — deliberadamente
      # distinto de MSSQL_SA_PASSWORD: nunca la misma clave para dos secretos distintos.
      Tde__MasterKeyPassword: "${TDE_MASTER_KEY_PASSWORD:-BingoCart_TdeKey_2026#}"
      # Clave de firma HMAC-SHA256 de JWT (spec FEAT-001b, Block 1) — mismo default de desarrollo
      # local que appsettings.Development.json, nunca un secreto real. Sobreescribible con la
      # variable de entorno JWT_SIGNING_KEY del host si se necesita otra.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:--uBhxtdhOe3nsTJGPrTVZP1EL16zOGI0VYCVTbY8Zr57}"
      # Dentro de la red de docker-compose el host es el nombre del servicio (`redis`), no
      # localhost — mismo criterio que ConnectionStrings__Default para `db` (Block 1, spec
      # FEAT-008b).
      Redis__ConnectionString: "redis:6379"
      # Dentro de la red de docker-compose el host es el nombre del servicio (`smtp4dev`), puerto
      # interno 25 (2525 es solo el mapeo al host, ver el servicio `smtp4dev` arriba) — mismo
      # criterio que Redis__ConnectionString/ConnectionStrings__Default. AllowInvalidCertificate en
      # true SOLO acá (Development): smtp4dev usa un certificado autofirmado, nunca así en una
      # config de Producción real (R-08, SmtpSettings.AllowInvalidCertificate).
      Smtp__Host: "smtp4dev"
      Smtp__Port: "25"
      Smtp__From: "no-reply@bingocart.local"
      Smtp__AllowInvalidCertificate: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      smtp4dev:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bingocart-web
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  bingocart-db-data:
